<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KL Kotid">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>KL Kotid</title>
<style>
:root {
  --bg: #f2f2f7;
  --card: #fff;
  --text: #1c1c1e;
  --text2: #8e8e93;
  --text3: #c7c7cc;
  --accent: #385a4a;
  --danger: #ff3b30;
  --border: #e5e5ea;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --text2: #8e8e93;
    --text3: #48484a;
    --border: #38383a;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  -webkit-user-select: none; user-select: none;
  min-height: 100dvh;
}
header {
  padding: 12px 20px 8px;
  display: flex; justify-content: space-between; align-items: center;
}
header h1 { font-size: 28px; font-weight: 700; }
.btn-add {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.search {
  margin: 4px 16px 8px; padding: 8px 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  font-size: 15px; color: var(--text); width: calc(100% - 32px);
  outline: none;
}
.search::placeholder { color: var(--text2); }
.hint {
  text-align: center; font-size: 12px; color: var(--text3);
  padding: 12px 20px 20px;
}
#app { padding: 0 0 80px; }
#rev-report { padding: 0 0 80px; display: none; }

.tab-bar {
  display: flex; margin: 0 16px 4px; gap: 0;
  background: var(--card); border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600;
  background: none; border: none; color: var(--text2); cursor: pointer;
}
.tab-btn.active { background: var(--accent); color: #fff; }

.rev-toolbar {
  display: flex; gap: 8px; margin: 8px 16px 0; align-items: center;
}
.rev-toolbar .search {
  margin: 0; flex: 1; width: auto;
}
.rev-filter-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--card); color: var(--text2); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: 1px solid var(--border); flex-shrink: 0;
}
.rev-filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.rev-filters {
  display: none; margin: 4px 16px 0; gap: 8px;
  background: var(--card); border-radius: 10px; padding: 10px 12px;
  border: 1px solid var(--border);
}
.rev-filters.open { display: flex; flex-wrap: wrap; }
.rev-filters label {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text2); cursor: pointer;
}
.rev-filters label input { accent-color: var(--accent); width: 16px; height: 16px; }

.rev-section {
  margin: 8px 16px; background: var(--card);
  border-radius: 12px; overflow: hidden;
}
.rev-header {
  display: flex; align-items: center; padding: 14px 16px;
  cursor: pointer; gap: 10px;
}
.rev-header .rev-title { flex: 1; }
.rev-header .rev-title strong { font-size: 15px; display: block; }
.rev-header .rev-title small { font-size: 11px; color: var(--text2); }
.rev-header .count {
  font-size: 12px; color: var(--text2);
  background: var(--bg); padding: 2px 8px; border-radius: 10px;
}
.rev-header .chevron {
  font-size: 13px; color: var(--text2); transition: transform 0.2s;
}
.rev-header.open .chevron { transform: rotate(90deg); }
.rev-content { display: none; }
.rev-header.open + .rev-content { display: block; }
.rev-includes {
  padding: 6px 16px; font-size: 12px; color: var(--text2);
  border-top: 1px solid var(--border);
}
.rev-item {
  display: flex; align-items: center; padding: 10px 16px; gap: 10px;
  border-top: 1px solid var(--border);
}
.rev-item .check-icon {
  width: 22px; height: 22px; flex-shrink: 0;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  color: var(--text3);
}
.rev-item .check-icon.covered { color: #34c759; }
.rev-item .name { flex: 1; font-size: 14px; }
.rev-item .name.unchecked { color: var(--text2); }
.rev-linked {
  padding: 3px 16px 3px 50px; font-size: 12px; color: var(--text2);
  display: flex; align-items: baseline; gap: 4px;
}
.rev-linked .location { font-size: 10px; color: var(--text3); }

.bag {
  margin: 8px 16px; background: var(--card);
  border-radius: 12px; overflow: hidden;
}
.bag-header {
  display: flex; align-items: center; padding: 14px 16px;
  cursor: pointer; gap: 10px;
}
.bag-header .icon { font-size: 18px; color: var(--accent); }
.bag-header .name-col { flex: 1; }
.bag-header .name-col .name { font-weight: 600; font-size: 16px; display: block; }
.bag-header .count {
  font-size: 12px; color: var(--text2);
  background: var(--bg); padding: 2px 8px; border-radius: 10px;
}
.bag-header .chevron {
  font-size: 13px; color: var(--text2);
  transition: transform 0.2s;
}
.bag-header.open .chevron { transform: rotate(90deg); }
.bag-content { display: none; }
.bag-header.open + .bag-content { display: block; }

.sub-header {
  display: flex; align-items: center; padding: 10px 16px 10px 36px;
  cursor: pointer; gap: 8px;
}
.sub-header .icon { font-size: 13px; color: var(--text2); }
.sub-header .name-col { flex: 1; }
.sub-header .name-col .name { font-size: 15px; display: block; }
.sub-header .count {
  font-size: 11px; color: var(--text2);
  background: var(--bg); padding: 1px 6px; border-radius: 8px;
}
.sub-header .chevron { font-size: 11px; color: var(--text2); transition: transform 0.2s; }
.sub-header.open .chevron { transform: rotate(90deg); }
.sub-content { display: none; }
.sub-header.open + .sub-content { display: block; }

.item {
  display: flex; align-items: flex-start; padding: 10px 16px 10px 48px;
  border-top: 1px solid var(--border); gap: 8px;
  position: relative; overflow: hidden;
}
.item.depth2 { padding-left: 64px; }
.item .check-btn {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  background: none; cursor: pointer; flex-shrink: 0;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  color: var(--text3); padding: 0; margin-top: 1px;
}
.item .check-btn.checked { color: #34c759; }
.item .name-col { flex: 1; }
.item .name-col .name { font-size: 15px; }
.item .name-col .name.unchecked { color: var(--text2); }
.rev-tag {
  font-size: 10px; color: #007aff; background: rgba(0,122,255,0.12);
  padding: 1px 5px; border-radius: 8px; white-space: nowrap;
  display: inline-block; margin-top: 2px; margin-right: 3px;
}
.item .actions {
  display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;
  flex-shrink: 0;
}
.item:hover .actions, .item:focus-within .actions { opacity: 1; }
.action-btn {
  background: none; border: none; color: var(--text2);
  font-size: 16px; padding: 4px; cursor: pointer; border-radius: 6px;
}
.action-btn:hover { background: var(--bg); }
.action-btn.danger { color: var(--danger); }

.add-row {
  display: flex; align-items: center; padding: 10px 16px 10px 48px;
  border-top: 1px solid var(--border); gap: 8px;
  cursor: pointer; color: var(--text2); font-size: 14px;
}
.add-row.depth2 { padding-left: 64px; }
.add-row:hover { color: var(--accent); }

@media (hover: none) {
  .item .actions { opacity: 1; }
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 500px; padding: 20px 20px calc(20px + var(--safe-bottom));
  transform: translateY(100%); transition: transform 0.3s;
  max-height: 80vh; overflow-y: auto;
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
.modal input, .modal select {
  width: 100%; padding: 12px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 16px; background: var(--bg);
  color: var(--text); margin-bottom: 12px; outline: none;
}
.modal select { appearance: auto; }
.modal label {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; margin-bottom: 16px; color: var(--text2);
}
.modal label input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button {
  flex: 1; padding: 12px; border-radius: 10px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.modal-btns .cancel { background: var(--bg); color: var(--text); }
.modal-btns .confirm { background: var(--accent); color: #fff; }

.rev-picker-section {
  margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.rev-picker-header {
  display: flex; align-items: center; padding: 10px 12px; cursor: pointer;
  background: var(--bg); gap: 8px;
}
.rev-picker-header .title { flex: 1; font-size: 14px; font-weight: 600; }
.rev-picker-header .badge {
  font-size: 11px; color: #34c759; background: rgba(52,199,89,0.15);
  padding: 1px 6px; border-radius: 8px;
}
.rev-picker-header .chevron { font-size: 11px; color: var(--text2); transition: transform 0.2s; }
.rev-picker-header.open .chevron { transform: rotate(90deg); }
.rev-picker-items { display: none; }
.rev-picker-header.open + .rev-picker-items { display: block; }
.rev-picker-item {
  display: flex; align-items: center; padding: 8px 12px; gap: 8px;
  border-top: 1px solid var(--border); cursor: pointer; font-size: 14px;
}
.rev-picker-item:hover { background: var(--bg); }
.rev-picker-item .check { color: var(--text3); font-size: 16px; }
.rev-picker-item .check.on { color: #34c759; }

.search-result {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--border); gap: 10px;
}
.search-result .path { font-size: 12px; color: var(--text2); }

#install-banner {
  display: none; margin: 8px 16px; padding: 14px 16px;
  background: var(--accent); color: #fff; border-radius: 12px;
  text-align: center; cursor: pointer; font-weight: 600; font-size: 15px;
}
</style>
</head>
<body>
<header>
  <h1>KL Kotid</h1>
  <button class="btn-add" onclick="showAddBag()" title="Uus kott">+</button>
</header>
<div class="tab-bar">
  <button class="tab-btn active" id="tab-bags" onclick="switchTab('bags')">Kotid</button>
  <button class="tab-btn" id="tab-rev" onclick="switchTab('rev')">REV raport</button>
</div>
<div id="bags-view">
  <input class="search" type="search" placeholder="Otsi varustust..." oninput="onSearch(this.value)">
  <div id="install-banner" onclick="installApp()"></div>
  <div id="app"></div>
  <div class="hint">Vajuta koti nimele, et avada. Nupud asjade liigutamiseks ja kustutamiseks.</div>
</div>
<div id="rev-report"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const STORAGE_KEY = 'kl-kotid-data';

const DEFAULT_DATA = [
  { id: 1, name: "Vormi varrukad", isContainer: true, parentId: null, order: 0 },
  { id: 2, name: "Pisiprillid", isContainer: false, parentId: 1, order: 0 },
  { id: 3, name: "Kõrvatropid", isContainer: false, parentId: 1, order: 1 },

  { id: 4, name: "Taktikaline vöö", isContainer: true, parentId: null, order: 1 },
  { id: 5, name: "Prillid", isContainer: false, parentId: 4, order: 0 },
  { id: 6, name: "Vesi", isContainer: false, parentId: 4, order: 1 },

  { id: 7, name: "3-1 tagakott", isContainer: true, parentId: null, order: 2 },
  { id: 8, name: "Pealamp", isContainer: false, parentId: 7, order: 0 },
  { id: 9, name: "Torusall", isContainer: false, parentId: 7, order: 1 },
  { id: 10, name: "Kiivrialune müts", isContainer: false, parentId: 7, order: 2 },
  { id: 11, name: "Kindad", isContainer: false, parentId: 7, order: 3 },

  { id: 12, name: "Kott", isContainer: true, parentId: null, order: 3 },
  { id: 13, name: "Vasak tasku", isContainer: true, parentId: 12, order: 0 },
  { id: 14, name: "Toiduasjad", isContainer: false, parentId: 13, order: 0 },
  { id: 15, name: "Põlvekaitsed", isContainer: false, parentId: 13, order: 1 },
  { id: 16, name: "Parem tasku", isContainer: true, parentId: 12, order: 1 },
  { id: 17, name: "Labidas", isContainer: false, parentId: 16, order: 0 },
  { id: 18, name: "Bivi + vaiad + nöör", isContainer: false, parentId: 16, order: 1 },
  { id: 19, name: "Kilejope", isContainer: false, parentId: 12, order: 2 },
  { id: 20, name: "Sviiter", isContainer: false, parentId: 12, order: 3 },
  { id: 21, name: "Teised püksid", isContainer: false, parentId: 12, order: 4 },
  { id: 22, name: "Teine frentš või vestialune särk", isContainer: false, parentId: 12, order: 5 },
  { id: 23, name: "3 pk toitu", isContainer: false, parentId: 12, order: 6 },
  { id: 24, name: "Kilekott riietega", isContainer: true, parentId: 12, order: 7 },
  { id: 25, name: "4 paari sokke", isContainer: false, parentId: 24, order: 0 },
  { id: 26, name: "2 paari trussikuid", isContainer: false, parentId: 24, order: 1 },
  { id: 27, name: "2 puuvillast t-särki", isContainer: false, parentId: 24, order: 2 },
  { id: 28, name: "1 mil t-särk", isContainer: false, parentId: 24, order: 3 },

  { id: 29, name: "Patrullkott", isContainer: true, parentId: null, order: 4 },
  { id: 30, name: "Käterätik", isContainer: false, parentId: 29, order: 0 },
  { id: 31, name: "Hambatarbed", isContainer: false, parentId: 29, order: 1 },
  { id: 32, name: "1 x toit", isContainer: false, parentId: 29, order: 2 },
  { id: 33, name: "2 paari sokke", isContainer: false, parentId: 29, order: 3 },
  { id: 34, name: "Trussad", isContainer: false, parentId: 29, order: 4 },
  { id: 35, name: "T-särk", isContainer: false, parentId: 29, order: 5 },
  { id: 36, name: "Hügieen", isContainer: false, parentId: 29, order: 6 },
  { id: 37, name: "Õpikud", isContainer: false, parentId: 29, order: 7 },
  { id: 38, name: "Ülemine tasku", isContainer: true, parentId: 29, order: 8 },
  { id: 39, name: "Nõeladniidid", isContainer: false, parentId: 38, order: 0 },
  { id: 40, name: "Kõrvatropid", isContainer: false, parentId: 38, order: 1 },
  { id: 41, name: "Prillid", isContainer: false, parentId: 38, order: 2 },
  { id: 42, name: "Mobiililaadija", isContainer: false, parentId: 38, order: 3 },
  { id: 43, name: "Akupank", isContainer: false, parentId: 38, order: 4 },
  { id: 44, name: "Rohelise teibiga pisikott – esmaabi", isContainer: true, parentId: 29, order: 9 },
  { id: 45, name: "Õmblus", isContainer: false, parentId: 44, order: 0 },
  { id: 46, name: "Sidemed", isContainer: false, parentId: 44, order: 1 },
  { id: 47, name: "Kõrvatropid", isContainer: false, parentId: 44, order: 2 },
  { id: 48, name: "Kummiga konksud", isContainer: false, parentId: 44, order: 3 },
  { id: 49, name: "Teine pisikott", isContainer: true, parentId: 29, order: 10 },
  { id: 50, name: "Kindad", isContainer: false, parentId: 49, order: 0 },
  { id: 51, name: "Teip", isContainer: false, parentId: 49, order: 1 },
  { id: 52, name: "Kamopastad", isContainer: false, parentId: 49, order: 2 },
  { id: 53, name: "Helkur", isContainer: false, parentId: 49, order: 3 },
  { id: 54, name: "Varukaitseprillid", isContainer: false, parentId: 49, order: 4 },
];

let data = [];
let nextId = 100;
let openSections = new Set();

function load() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    data = JSON.parse(stored);
  } else {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  for (const d of data) {
    if (d.isChecked === undefined) d.isChecked = false;
    if (d.revItemId === undefined) d.revItemId = null;
    if (d.isNeeded === undefined) d.isNeeded = false;
  }
  nextId = Math.max(...data.map(d => d.id), 0) + 1;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getChildren(parentId) {
  return data.filter(d => d.parentId === parentId).sort((a, b) => a.order - b.order);
}

function countItems(parentId) {
  const children = getChildren(parentId);
  let count = 0;
  for (const c of children) {
    if (c.isContainer) count += countItems(c.id);
    else count++;
  }
  return count;
}

function countCheckedItems(parentId) {
  const children = getChildren(parentId);
  let count = 0;
  for (const c of children) {
    if (c.isContainer) count += countCheckedItems(c.id);
    else if (c.isChecked) count++;
  }
  return count;
}

function uncheckAll(parentId) {
  const children = getChildren(parentId);
  for (const c of children) {
    if (c.isContainer) uncheckAll(c.id);
    else c.isChecked = false;
  }
}

function toggleCheck(id) {
  const item = data.find(d => d.id === id);
  if (item) item.isChecked = !item.isChecked;
  save(); render();
}

function toggleNeeded(id) {
  const item = data.find(d => d.id === id);
  if (item) item.isNeeded = !item.isNeeded;
  save(); render();
}

function getPath(nodeId) {
  const parts = [];
  let current = data.find(d => d.id === nodeId);
  while (current) {
    parts.unshift(current.name);
    current = current.parentId ? data.find(d => d.id === current.parentId) : null;
  }
  return parts.join(' > ');
}

function getAllContainers() {
  return data.filter(d => d.isContainer);
}

function deleteNode(id) {
  const children = getChildren(id);
  for (const c of children) deleteNode(c.id);
  data = data.filter(d => d.id !== id);
}

function getRevItemIds(node) {
  if (!node.revItemId) return [];
  return node.revItemId.split(',').filter(Boolean);
}

function setRevItemIds(node, ids) {
  node.revItemId = ids.length ? ids.join(',') : null;
}

function getUniqueRevLabels(node) {
  const ids = getRevItemIds(node);
  const seen = new Set();
  const labels = [];
  for (const id of ids) {
    const label = getREVLabel(id);
    if (label && !seen.has(label)) {
      seen.add(label);
      labels.push(label);
    }
  }
  return labels;
}

function getREVLabel(revItemId) {
  if (!revItemId) return null;
  for (const level of REV_LEVELS) {
    if (level.items.some(i => i.id === revItemId)) return level.title;
  }
  return null;
}

function getLinkedItems(revItemId) {
  return data.filter(d => {
    const ids = getRevItemIds(d);
    return ids.includes(revItemId);
  });
}

function renderRevTags(node) {
  const labels = getUniqueRevLabels(node);
  if (!labels.length) return '';
  return '<div style="margin-top:2px">' + labels.map(l => `<span class="rev-tag">${esc(l)}</span>`).join('') + '</div>';
}

function render() {
  const app = document.getElementById('app');
  const needed = data.filter(d => !d.isContainer && d.isNeeded);
  let neededHtml = '';
  if (needed.length > 0) {
    const items = needed.map(item => {
      const parent = data.find(d => d.id === item.parentId);
      const loc = parent ? ` <span style="font-size:11px;color:var(--text2)">${esc(getPath(parent.id))}</span>` : '';
      return `<div class="item" style="border-left:3px solid var(--danger)">
        <span style="color:var(--danger);font-size:16px">&#x2757;</span>
        <span class="name-col"><span class="name">${esc(item.name)}</span>${loc}</span>
        <button class="action-btn" onclick="toggleNeeded(${item.id})" title="Eemalda" style="color:#34c759;font-size:16px">&#x2714;</button>
      </div>`;
    }).join('');
    neededHtml = `<div class="bag" style="border:1px solid var(--danger);border-radius:12px">
      <div class="bag-header open" style="background:rgba(255,59,48,0.1);cursor:default">
        <span style="color:var(--danger);font-size:16px">&#x26A0;</span>
        <span class="name-col"><span class="name" style="color:var(--danger);font-weight:700">Vaja lisada</span></span>
      </div>
      <div class="bag-content">${items}</div>
    </div>`;
  }
  const bags = getChildren(null);
  app.innerHTML = neededHtml + bags.map(bag => renderBag(bag)).join('');
}

function renderBag(bag) {
  const isOpen = openSections.has(bag.id);
  const total = countItems(bag.id);
  const checked = countCheckedItems(bag.id);
  const children = getChildren(bag.id);

  let content = '';
  for (const child of children) {
    if (child.isContainer) {
      content += renderSubContainer(child);
    } else {
      content += renderItem(child, 1);
    }
  }
  content += `<div class="add-row" onclick="showAddItem(${bag.id})">+ Lisa...</div>`;
  content += `<div class="add-row" style="gap:12px;flex-wrap:wrap">
    <span onclick="showSetREV(${bag.id})" style="cursor:pointer;color:var(--text2)">&#x1F4CB; Määra REV</span>
    <span onclick="showRename(${bag.id},'${esc(bag.name)}')" style="cursor:pointer;color:var(--text2)">&#x270E; Muuda nime</span>
    <span onclick="showMoveItem(${bag.id})" style="cursor:pointer;color:var(--text2)">&#x21C5; Liiguta</span>
    <span onclick="doMoveUp(${bag.id})" style="cursor:pointer;color:var(--text2)">&#x2191; Üles</span>
    <span onclick="doMoveDown(${bag.id})" style="cursor:pointer;color:var(--text2)">&#x2193; Alla</span>
    ${checked > 0 ? `<span onclick="doUncheckAll(${bag.id})" style="cursor:pointer;color:var(--text2)">&#x21BA; Tühjenda linnukesed</span>` : ''}
    <span onclick="confirmDelete(${bag.id},'${esc(bag.name)}')" style="cursor:pointer;color:var(--danger)">&#x2715; Kustuta</span>
  </div>`;

  const countColor = checked === total && total > 0 ? 'color:#34c759' : '';
  const revTags = renderRevTags(bag);
  return `<div class="bag">
    <div class="bag-header ${isOpen ? 'open' : ''}" onclick="toggle(${bag.id})">
      <span class="icon">&#x1F392;</span>
      <span class="name-col"><span class="name">${esc(bag.name)}</span>${revTags}</span>
      <span class="count" style="${countColor}">${checked}/${total}</span>
      <span class="chevron">&#x276F;</span>
    </div>
    <div class="bag-content">${content}</div>
  </div>`;
}

function renderSubContainer(node) {
  const isOpen = openSections.has(node.id);
  const total = countItems(node.id);
  const checked = countCheckedItems(node.id);
  const children = getChildren(node.id);

  let content = '';
  for (const child of children) {
    if (child.isContainer) {
      content += renderSubContainer(child);
    } else {
      content += renderItem(child, 2);
    }
  }
  content += `<div class="add-row depth2" onclick="showAddItem(${node.id})">+ Lisa...</div>`;

  const countColor = checked === total && total > 0 ? 'color:#34c759' : '';
  const revTags = renderRevTags(node);
  return `<div class="sub-header ${isOpen ? 'open' : ''}" onclick="toggle(${node.id})">
    <span class="icon">&#x1F4C1;</span>
    <span class="name-col"><span class="name">${esc(node.name)}</span>${revTags}</span>
    <span class="count" style="${countColor}">${checked}/${total}</span>
    <span class="chevron">&#x276F;</span>
    <button class="action-btn" onclick="event.stopPropagation();showSetREV(${node.id})" title="Määra REV">&#x1F4CB;</button>
    <button class="action-btn" onclick="event.stopPropagation();showRename(${node.id},'${esc(node.name)}')" title="Muuda nime">&#x270E;</button>
    <button class="action-btn" onclick="event.stopPropagation();showMoveItem(${node.id})" title="Liiguta">&#x21C5;</button>
    <button class="action-btn" onclick="event.stopPropagation();doMoveUp(${node.id})" title="Üles">&#x2191;</button>
    <button class="action-btn" onclick="event.stopPropagation();doMoveDown(${node.id})" title="Alla">&#x2193;</button>
    <button class="action-btn danger" onclick="event.stopPropagation();confirmDelete(${node.id},'${esc(node.name)}')" title="Kustuta">&#x2715;</button>
  </div>
  <div class="sub-content">${content}</div>`;
}

function renderItem(item, depth) {
  const depthClass = depth >= 2 ? ' depth2' : '';
  const checked = item.isChecked;
  const revTags = renderRevTags(item);
  return `<div class="item${depthClass}">
    <button class="check-btn${checked ? ' checked' : ''}" onclick="toggleCheck(${item.id})">${checked ? '&#x2714;' : '&#x25CB;'}</button>
    <span class="name-col"><span class="name${checked ? '' : ' unchecked'}">${esc(item.name)}</span>${item.isNeeded ? ' <span style="color:var(--danger);font-size:14px">&#x2757;</span>' : ''}${revTags}</span>
    <span class="actions">
      <button class="action-btn" onclick="toggleNeeded(${item.id})" title="${item.isNeeded ? 'Eemalda meeldetuletus' : 'Vaja lisada!'}" style="${item.isNeeded ? 'color:var(--danger)' : ''}">${item.isNeeded ? '&#x2757;' : '&#x2755;'}</button>
      <button class="action-btn" onclick="showSetREV(${item.id})" title="Määra REV">&#x1F4CB;</button>
      <button class="action-btn" onclick="showRename(${item.id},'${esc(item.name)}')" title="Muuda nime">&#x270E;</button>
      <button class="action-btn" onclick="showMoveItem(${item.id})" title="Liiguta">&#x21C5;</button>
      <button class="action-btn" onclick="doMoveUp(${item.id})" title="Üles">&#x2191;</button>
      <button class="action-btn" onclick="doMoveDown(${item.id})" title="Alla">&#x2193;</button>
      <button class="action-btn danger" onclick="confirmDelete(${item.id},'${esc(item.name)}')" title="Kustuta">&#x2715;</button>
    </span>
  </div>`;

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toggle(id) {
  if (openSections.has(id)) openSections.delete(id);
  else openSections.add(id);
  render();
}

function onSearch(query) {
  const app = document.getElementById('app');
  if (!query.trim()) { render(); return; }
  const q = query.toLowerCase();
  const matches = data.filter(d => d.name.toLowerCase().includes(q));
  app.innerHTML = matches.map(m => {
    const path = m.parentId ? getPath(m.parentId) : '';
    return `<div class="search-result">
      <span class="name">${esc(m.name)}</span>
      ${path ? `<span class="path">${esc(path)}</span>` : ''}
    </div>`;
  }).join('') || '<div class="hint">Ei leitud</div>';
}

// Reorder
function doMoveUp(id) {
  const node = data.find(d => d.id === id);
  if (!node) return;
  const siblings = getChildren(node.parentId);
  const idx = siblings.findIndex(s => s.id === id);
  if (idx <= 0) return;
  const prev = siblings[idx - 1];
  const tmp = node.order;
  node.order = prev.order;
  prev.order = tmp;
  save(); render();
}

function doMoveDown(id) {
  const node = data.find(d => d.id === id);
  if (!node) return;
  const siblings = getChildren(node.parentId);
  const idx = siblings.findIndex(s => s.id === id);
  if (idx < 0 || idx >= siblings.length - 1) return;
  const next = siblings[idx + 1];
  const tmp = node.order;
  node.order = next.order;
  next.order = tmp;
  save(); render();
}

// Modals
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function showAddBag() {
  openModal(`
    <h3>Uus kott</h3>
    <input type="text" id="m-name" placeholder="Koti nimetus" autofocus>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Tühista</button>
      <button class="confirm" onclick="doAddBag()">Lisa</button>
    </div>
  `);
  setTimeout(() => document.getElementById('m-name')?.focus(), 300);
}

function doAddBag() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) return;
  const bags = getChildren(null);
  const maxOrder = bags.length ? Math.max(...bags.map(b => b.order)) + 1 : 0;
  data.push({ id: nextId++, name, isContainer: true, parentId: null, order: maxOrder, isChecked: false, revItemId: null });
  save(); closeModal(); render();
}

function showAddItem(containerId) {
  const container = data.find(d => d.id === containerId);
  openModal(`
    <h3>Lisa: ${esc(container.name)}</h3>
    <input type="text" id="m-name" placeholder="Nimetus" autofocus>
    <label><input type="checkbox" id="m-is-container"> Tasku / alamkott</label>
    <div id="m-rev-picker">${buildREVPicker([])}</div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Tühista</button>
      <button class="confirm" onclick="doAddItem(${containerId})">Lisa</button>
    </div>
  `);
  setTimeout(() => document.getElementById('m-name')?.focus(), 300);
}

function doAddItem(containerId) {
  const name = document.getElementById('m-name').value.trim();
  const isContainer = document.getElementById('m-is-container').checked;
  if (!name) return;
  const siblings = getChildren(containerId);
  const maxOrder = siblings.length ? Math.max(...siblings.map(s => s.order)) + 1 : 0;
  const selectedIds = getPickerSelectedIds();
  const revId = selectedIds.length ? selectedIds.join(',') : null;
  data.push({ id: nextId++, name, isContainer, parentId: containerId, order: maxOrder, isChecked: false, revItemId: revId });
  openSections.add(containerId);
  save(); closeModal(); render();
}

function confirmDelete(id, name) {
  const node = data.find(d => d.id === id);
  const isContainer = node && node.isContainer;
  const label = isContainer ? 'Kustuta koos sisuga?' : 'Kustuta?';
  openModal(`
    <h3>${label}</h3>
    <p style="margin-bottom:16px;color:var(--text2)">${esc(name)}</p>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Tühista</button>
      <button class="confirm" style="background:var(--danger)" onclick="doDelete(${id})">Kustuta</button>
    </div>
  `);
}

function doDelete(id) {
  deleteNode(id);
  save(); closeModal(); render();
}

function isDescendantOf(nodeId, ancestorId) {
  let current = data.find(d => d.id === nodeId);
  while (current) {
    if (current.id === ancestorId) return true;
    current = current.parentId ? data.find(d => d.id === current.parentId) : null;
  }
  return false;
}

function showMoveItem(itemId) {
  const item = data.find(d => d.id === itemId);
  const containers = getAllContainers();
  const options = containers
    .filter(c => c.id !== itemId && !isDescendantOf(c.id, itemId))
    .map(c => `<option value="${c.id}" ${c.id === item.parentId ? 'selected disabled' : ''}>${esc(getPath(c.id))}</option>`)
    .join('');

  openModal(`
    <h3>Liiguta: ${esc(item.name)}</h3>
    <select id="m-target" style="appearance:auto">${options}</select>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Tühista</button>
      <button class="confirm" onclick="doMove(${itemId})">Liiguta</button>
    </div>
  `);
}

function doMove(itemId) {
  const targetId = parseInt(document.getElementById('m-target').value);
  const item = data.find(d => d.id === itemId);
  if (!item || targetId === item.parentId) return;
  const siblings = getChildren(targetId);
  item.parentId = targetId;
  item.order = siblings.length ? Math.max(...siblings.map(s => s.order)) + 1 : 0;
  openSections.add(targetId);
  save(); closeModal(); render();
}

function showRename(id, currentName) {
  openModal(`
    <h3>Muuda nime</h3>
    <input type="text" id="m-name" value="${currentName}" autofocus>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Tühista</button>
      <button class="confirm" onclick="doRename(${id})">Salvesta</button>
    </div>
  `);
  setTimeout(() => { const el = document.getElementById('m-name'); el?.focus(); el?.select(); }, 300);
}

function doRename(id) {
  const name = document.getElementById('m-name').value.trim();
  if (!name) return;
  const node = data.find(d => d.id === id);
  if (node) node.name = name;
  save(); closeModal(); render();
}

// REV picker (accordion with multi-select)
let revPickerOpen = new Set();

function buildREVPicker(selectedIds) {
  let html = '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">REV kategooriad</div>';
  if (selectedIds.length) {
    html += `<div style="margin-bottom:8px"><span onclick="clearRevPicker()" style="cursor:pointer;color:var(--danger);font-size:13px">Eemalda koik</span></div>`;
  }
  for (const level of REV_LEVELS) {
    const levelSelected = level.items.filter(i => selectedIds.includes(i.id)).length;
    const isOpen = revPickerOpen.has(level.id);
    html += `<div class="rev-picker-section">`;
    html += `<div class="rev-picker-header ${isOpen ? 'open' : ''}" onclick="toggleRevPicker('${level.id}')">
      <span class="title">${esc(level.title)} - ${esc(level.subtitle)}</span>
      ${levelSelected > 0 ? `<span class="badge">${levelSelected}</span>` : ''}
      <span class="chevron">&#x276F;</span>
    </div>`;
    html += `<div class="rev-picker-items">`;
    for (const item of level.items) {
      const isOn = selectedIds.includes(item.id);
      html += `<div class="rev-picker-item" onclick="toggleRevPickerItem('${item.id}')">
        <span class="check ${isOn ? 'on' : ''}">${isOn ? '&#x2714;' : '&#x25CB;'}</span>
        <span>${esc(item.name)}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function toggleRevPicker(levelId) {
  if (revPickerOpen.has(levelId)) revPickerOpen.delete(levelId);
  else revPickerOpen.add(levelId);
  refreshRevPicker();
}

function toggleRevPickerItem(itemId) {
  const el = document.getElementById('m-rev-picker');
  if (!el) return;
  const current = getPickerSelectedIds();
  const idx = current.indexOf(itemId);
  if (idx >= 0) current.splice(idx, 1);
  else current.push(itemId);
  el.dataset.selected = current.join(',');
  refreshRevPicker();
}

function clearRevPicker() {
  const el = document.getElementById('m-rev-picker');
  if (el) el.dataset.selected = '';
  refreshRevPicker();
}

function refreshRevPicker() {
  const el = document.getElementById('m-rev-picker');
  if (!el) return;
  const ids = getPickerSelectedIds();
  el.innerHTML = buildREVPicker(ids);
}

function getPickerSelectedIds() {
  const el = document.getElementById('m-rev-picker');
  if (!el || !el.dataset.selected) return [];
  return el.dataset.selected.split(',').filter(Boolean);
}

function showSetREV(itemId) {
  const item = data.find(d => d.id === itemId);
  const currentIds = getRevItemIds(item);
  revPickerOpen = new Set();
  openModal(`
    <h3>Määra REV: ${esc(item.name)}</h3>

}

function doSetREV(itemId) {
  const selectedIds = getPickerSelectedIds();
  const item = data.find(d => d.id === itemId);

  save(); closeModal(); render();

let revOpenSections = new Set();
let revSearchQuery = '';
let revShowMissingOnly = false;
let revHideWinter = false;

function toggleREVSection(id) {
  if (revOpenSections.has(id)) revOpenSections.delete(id);
  else revOpenSections.add(id);
  renderREV();
}

function onRevSearch(query) {
  revSearchQuery = query.toLowerCase();
  renderREV();
}

function toggleRevFilter(type) {
  if (type === 'missing') revShowMissingOnly = !revShowMissingOnly;
  if (type === 'winter') revHideWinter = !revHideWinter;
  renderREV();
}

function toggleRevFiltersPanel() {
  document.getElementById('rev-filters-panel')?.classList.toggle('open');
}

function renderREV() {
  const el = document.getElementById('rev-report');
  const hasFilter = revShowMissingOnly || revHideWinter;
  const query = revSearchQuery;

  let toolbar = `<div class="rev-toolbar">
    <input class="search" type="search" placeholder="Otsi REV nimetust..." value="${esc(revSearchQuery)}" oninput="onRevSearch(this.value)">
    <button class="rev-filter-btn ${hasFilter ? 'active' : ''}" onclick="toggleRevFiltersPanel()" title="Filtrid">&#x2630;</button>
  </div>
  <div class="rev-filters ${document.getElementById('rev-filters-panel')?.classList.contains('open') ? 'open' : ''}" id="rev-filters-panel">
    <label><input type="checkbox" ${revShowMissingOnly ? 'checked' : ''} onchange="toggleRevFilter('missing')"> Ainult puuduvad</label>
    <label><input type="checkbox" ${revHideWinter ? 'checked' : ''} onchange="toggleRevFilter('winter')"> Peida talvised</label>
  </div>`;

  let sections = REV_LEVELS.map(level => {
    let items = level.items;

    if (query) {
      const matchingItems = items.filter(item =>
        item.name.toLowerCase().includes(query) ||
        getLinkedItems(item.id).some(g => g.name.toLowerCase().includes(query))
      );
      const levelMatches = level.title.toLowerCase().includes(query) ||
        level.subtitle.toLowerCase().includes(query);
      if (!matchingItems.length && !levelMatches) return '';
      if (matchingItems.length || !levelMatches) items = matchingItems.length ? matchingItems : items;
    }

    if (revHideWinter) {
      items = items.filter(i => !i.isWinter);
    }

    if (revShowMissingOnly) {
      items = items.filter(i => getLinkedItems(i.id).length === 0);
    }

    if (!items.length) return '';

    const isOpen = revOpenSections.has(level.id);
    const total = items.length;
    const coveredCount = items.filter(item => getLinkedItems(item.id).length > 0).length;
    const countColor = coveredCount === total && total > 0 ? 'color:#34c759' : '';

    let content = '';
    if (level.includes) {
      content += `<div class="rev-includes">↳ Sisaldab ${esc(level.includes)}</div>`;
    }
    content += items.map(item => {
      const linked = getLinkedItems(item.id);
      const hasCoverage = linked.length > 0;
      let html = `<div class="rev-item">
        <span class="check-icon${hasCoverage ? ' covered' : ''}">${hasCoverage ? '&#x2714;' : '&#x25CB;'}</span>
        <span class="name${hasCoverage ? '' : ' unchecked'}">${esc(item.name)}</span>
      </div>`;
      if (linked.length > 0) {
        html += linked.map(gear => {
          const parentPath = gear.parentId ? getPath(gear.parentId) : '';
          return `<div class="rev-linked">
            ↳ ${esc(gear.name)}${parentPath ? ` <span class="location">· ${esc(parentPath)}</span>` : ''}
          </div>`;
        }).join('');
      }
      return html;
    }).join('');

    return `<div class="rev-section">
      <div class="rev-header ${isOpen ? 'open' : ''}" onclick="toggleREVSection('${level.id}')">
        <div class="rev-title">
          <strong>${esc(level.title)} - ${esc(level.subtitle)}</strong>
          <small>${esc(level.duration)}</small>
        </div>
        <span class="count" style="${countColor}">${coveredCount}/${total}</span>
        <span class="chevron">&#x276F;</span>
      </div>
      <div class="rev-content">${content}</div>
    </div>`;
  }).join('');

  el.innerHTML = toolbar + sections;
}

// Install prompt
let deferredPrompt = null;
const banner = document.getElementById('install-banner');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  banner.style.display = 'block';
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      banner.style.display = 'none';
    });
  }
}

window.addEventListener('appinstalled', () => {
  banner.style.display = 'none';
});

const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
if (!isStandalone && !deferredPrompt) {
  const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
  if (isIos) {
    banner.innerHTML = 'Paigalda: ava <strong>Safaris</strong>, vajuta <strong>jagamise nuppu</strong> &#x2934; ja vali <strong>"Lisa avakuvale"</strong>';
  } else {
    banner.innerHTML = 'Paigalda: vajuta brauseri <strong>menüünuppu</strong> &#x22EE; ja vali <strong>"Lisa avakuvale"</strong>';
  }
  banner.style.display = 'block';
  banner.style.cursor = 'default';
  banner.onclick = null;
}

// Init
load();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
